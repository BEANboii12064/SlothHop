<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SlothHop - Safe Fun</title>
    <link rel="stylesheet" href="slothhopstyle.css">
</head>
<body>
    <div class="welcome-container">
        <h1 class="logo">🦥 SlothHop</h1>
        <p class="subtitle">The safer, slower, and better way to play games!</p>
        
        <!-- Clicking this button triggers the Parent Gate before entering -->
        <button id="playBtn" class="main-btn">PLAY NOW</button>
    </div>

    <!-- Hidden Parent Gate Modal Overlay -->
    <div id="parentGate" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>🔒 Grown-Ups Only</h2>
            <p>Please solve this problem to enter SlothHop. No tracking account needed!</p>
            <div id="mathQuestion" class="math-text"></div>
            <form id="gateForm">
                <input type="number" id="parentAnswer" placeholder="Your answer" required autofocus>
                <button type="submit" class="verify-btn">Verify and Enter</button>
            </form>
            <p id="errorMessage" class="error-text hidden">❌ Incorrect. Try again!</p>
        </div>
    </div>

    <script src="slothhopjs.js"></script>
</body>
</html>
